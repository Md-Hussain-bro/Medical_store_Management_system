{% extends "base.html" %}
{% block title %}Add Store - PharmaCare Pro{% endblock %}
{% block page_title %}Create New Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card animate-in">
            <div class="card-header">
                <div class="card-header-title">
                    <i class="bi bi-shop"></i> Store Details
                </div>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Store Info Section -->
                    <div class="mb-4">
                        <h6 style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;">
                            <i class="bi bi-building"></i> Store Information
                        </h6>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Store Name <span style="color: var(--danger);">*</span></label>
                                <input type="text" name="store_name" class="form-control"
                                       required placeholder="e.g., City Pharmacy">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">License Number</label>
                                <input type="text" name="license_no" class="form-control"
                                       placeholder="Drug license number">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2"
                                      placeholder="Full store address"></textarea>
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Phone</label>
                                <input type="tel" name="phone" class="form-control"
                                       placeholder="Contact number" inputmode="tel">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control"
                                       placeholder="store@example.com" inputmode="email">
                            </div>
                        </div>
                    </div>

                    <hr style="border-color: var(--border-light);">

                    <!-- Owner Section -->
                    <div class="mb-4">
                        <h6 style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;">
                            <i class="bi bi-person-badge"></i> Owner Account
                        </h6>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="owner_fullname" class="form-control"
                                       placeholder="Owner's full name">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Username <span style="color: var(--danger);">*</span></label>
                                <input type="text" name="owner_username" class="form-control"
                                       required placeholder="Login username" autocomplete="new-username">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password <span style="color: var(--danger);">*</span></label>
                            <input type="password" name="owner_password" class="form-control"
                                   required minlength="6" placeholder="Minimum 6 characters"
                                   autocomplete="new-password">
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Create Store
                        </button>
                        <a href="{{ url_for('admin_stores') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
