{% extends "base.html" %}

{% block title %}Add Store{% endblock %}

{% block content %}

<div class="container mt-4">
    <h2><i class="fas fa-plus"></i> Add New Store</h2>

```
<div class="card mt-3">
    <div class="card-body">

        <form method="POST">

            <h5 class="mb-3">Store Information</h5>

            <div class="mb-3">
                <label class="form-label">Store Name *</label>
                <input type="text" name="store_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">License Number</label>
                <input type="text" name="license_no" class="form-control">
            </div>

            <hr>

            <h5 class="mb-3">Owner Account</h5>

            <div class="mb-3">
                <label class="form-label">Owner Full Name</label>
                <input type="text" name="owner_fullname" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Owner Username *</label>
                <input type="text" name="owner_username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Owner Password *</label>
                <input type="password" name="owner_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Create Store
            </button>

            <a href="{{ url_for('admin_stores') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>
```

</div>
{% endblock %}
