{% extends "base.html" %}

{% block title %}Add Store{% endblock %}

{% block content %}

<div class="container mt-4">

```
<h2 class="mb-4">
    <i class="fas fa-store"></i> Add New Store
</h2>

<div class="card">
    <div class="card-body">

        <form method="POST">

            <h5 class="mb-3">Store Information</h5>

            <div class="mb-3">
                <label class="form-label">Store Name *</label>
                <input type="text"
                       name="store_name"
                       class="form-control"
                       value="{{ request.form.get('store_name','') }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text"
                       name="address"
                       class="form-control"
                       value="{{ request.form.get('address','') }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text"
                       name="phone"
                       class="form-control"
                       value="{{ request.form.get('phone','') }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ request.form.get('email','') }}">
            </div>

            <div class="mb-3">
                <label class="form-label">License Number</label>
                <input type="text"
                       name="license_no"
                       class="form-control"
                       value="{{ request.form.get('license_no','') }}">
            </div>

            <hr>

            <h5 class="mb-3">Owner Account</h5>

            <div class="mb-3">
                <label class="form-label">Owner Full Name</label>
                <input type="text"
                       name="owner_fullname"
                       class="form-control"
                       value="{{ request.form.get('owner_fullname','') }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Owner Username *</label>
                <input type="text"
                       name="owner_username"
                       class="form-control"
                       value="{{ request.form.get('owner_username','') }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Owner Password *</label>
                <input type="password"
                       name="owner_password"
                       class="form-control"
                       minlength="6"
                       required>
            </div>

            <div class="mt-4">

                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Create Store
                </button>

                <a href="{{ url_for('admin_stores') }}"
                   class="btn btn-secondary">
                   Cancel
                </a>

            </div>

        </form>

    </div>
</div>
```

</div>
{% endblock %}
