{% extends "base.html" %}
{% block title %}Add Staff - PharmaCare{% endblock %}
{% block page_title %}Add Staff User{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-person-plus"></i> New Staff User</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control"
                               placeholder="Staff member's full name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Username <span class="text-danger">*</span>
                        </label>
                        <input type="text" name="username" class="form-control" required
                               placeholder="Login username" autocomplete="new-username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Password <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="password" class="form-control" required
                               minlength="6" placeholder="Minimum 6 characters"
                               autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="staff">Staff</option>
                            <option value="owner">Owner / Manager</option>
                        </select>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Create User
                        </button>
                        <a href="{{ url_for('manage_users') }}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
