{% extends "base.html" %}
{% block title %}Add Medicine - PharmaCare Pro{% endblock %}
{% block page_title %}Add Medicine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card animate-in">
            <div class="card-header">
                <div class="card-header-title">
                    <i class="bi bi-plus-circle"></i> New Medicine
                </div>
            </div>
            <div class="card-body">
                <form method="POST" id="addMedicineForm">
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="name" class="form-label">Medicine Name <span style="color:var(--danger)">*</span></label>
                            <input type="text" name="name" id="name" class="form-control" required placeholder="e.g., Paracetamol 500mg">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="generic_name" class="form-label">Generic Name</label>
                            <input type="text" name="generic_name" id="generic_name" class="form-control" placeholder="e.g., Acetaminophen">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="medicine_type" class="form-label">Type <span style="color:var(--danger)">*</span></label>
                            <select name="medicine_type" id="medicine_type" class="form-select" onchange="toggleUnitsPerPack()">
                                <option value="tablet">Tablet</option><option value="capsule">Capsule</option>
                                <option value="syrup">Syrup</option><option value="injection">Injection</option>
                                <option value="cream">Cream</option><option value="ointment">Ointment</option>
                                <option value="drops">Drops</option><option value="inhaler">Inhaler</option>
                                <option value="powder">Powder</option><option value="gel">Gel</option>
                                <option value="lotion">Lotion</option><option value="balm">Balm</option>
                                <option value="spray">Spray</option><option value="suppository">Suppository</option>
                                <option value="patch">Patch</option><option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6" id="unitsPerPackSection">
                            <label for="units_per_pack" class="form-label">Units Per Strip</label>
                            <input type="number" name="units_per_pack" id="units_per_pack" class="form-control" min="1" placeholder="e.g., 10" inputmode="numeric">
                            <div class="form-text">Tablets/capsules per strip</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="batch_no" class="form-label">Batch Number <span style="color:var(--danger)">*</span></label>
                            <input type="text" name="batch_no" id="batch_no" class="form-control" required placeholder="e.g., BT-2024-001">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="expiry_date" class="form-label">Expiry Date <span style="color:var(--danger)">*</span></label>
                            <input type="date" name="expiry_date" id="expiry_date" class="form-control" required>
                        </div>
                    </div>

                    <!-- ============================================== -->
                    <!-- UPDATED HTML: Replace the quantity row section  -->
                    <!-- ============================================== -->

                    <!-- Row 4: Quantity Section (REPLACE existing quantity row) -->
                    <div class="row g-3 mb-3">
                        <!-- For countable: "Total Packs" input (replaces old quantity) -->
                        <div class="col-12 col-sm-6">
                            <label for="total_packs" class="form-label">
                                <span id="quantityLabel">Quantity</span>
                                <span style="color:var(--danger)">*</span>
                            </label>
                            <!-- This input is used for packs (countable) or quantity (non-countable) -->
                            <input type="number" name="total_packs" id="total_packs"
                                class="form-control" required min="0" value="0"
                                inputmode="numeric">
                            <div class="form-text" id="quantityHelp">Total units in stock</div>
                        </div>

                        <!-- Auto-calculated Total Units (readonly) - shown only for countable -->
                        <div class="col-12 col-sm-6" id="totalUnitsSection" style="display:none;">
                            <label for="total_units_display" class="form-label">
                                Total Individual Units
                            </label>
                            <input type="number" id="total_units_display"
                                class="form-control" readonly
                                style="background:#f1f5f9; font-weight:600;">
                            <!-- Hidden field sends actual quantity to backend -->
                            <input type="hidden" name="quantity" id="quantity" value="0">
                            <div class="form-text" id="totalUnitsHelp">
                                <i class="bi bi-calculator"></i>
                                <span id="breakdownText">Auto-calculated</span>
                            </div>
                        </div>

                        <!-- For non-countable: keep original breakdown section hidden -->
                        <div class="col-12 col-sm-6" id="quantityBreakdownSection"
                            style="display:none;">
                            <label class="form-label">&nbsp;</label>
                            <div class="alert alert-info py-2 mb-0"
                                style="font-size: 0.82rem;">
                                <i class="bi bi-calculator"></i>
                                <span id="nonCountableBreakdown">—</span>
                            </div>
                        </div>
                    </div>

                    <!-- ============================================== -->
                    <!-- UPDATED: Price section (add per-unit display)  -->
                    <!-- ============================================== -->
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="purchase_price" class="form-label">
                                Purchase Price ₹
                                <span style="color:var(--danger)">*</span>
                                <span style="color:var(--text-muted);font-size:0.75rem"
                                    id="purchasePriceLabel"></span>
                            </label>
                            <input type="number" name="purchase_price"
                                id="purchase_price" class="form-control"
                                required min="0" step="0.01"
                                placeholder="0.00" inputmode="decimal">
                            <!-- NEW: per-unit price display -->
                            <div class="form-text" id="purchasePerUnitDisplay"
                                style="display:none; color:#10b981; font-weight:500;">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="selling_price" class="form-label">
                                Selling Price ₹
                                <span style="color:var(--danger)">*</span>
                                <span style="color:var(--text-muted);font-size:0.75rem"
                                    id="sellingPriceLabel"></span>
                            </label>
                            <input type="number" name="selling_price"
                                id="selling_price" class="form-control"
                                required min="0" step="0.01"
                                placeholder="0.00" inputmode="decimal">
                            <!-- NEW: per-unit price display -->
                            <div class="form-text" id="sellingPerUnitDisplay"
                                style="display:none; color:#10b981; font-weight:500;">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="supplier" class="form-label">Supplier</label>
                        <input type="text" name="supplier" id="supplier" class="form-control" placeholder="Supplier name">
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Add Medicine</button>
                        <a href="{{ url_for('inventory') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const COUNTABLE_TYPES = ['tablet', 'capsule', 'suppository'];

function isCountable(t) {
    return COUNTABLE_TYPES.includes(t);
}

/**
 * toggleUnitsPerPack()
 * Called when medicine_type changes.
 * - Countable: show units_per_pack, total_packs input,
 *   readonly total_units, price per pack labels
 * - Non-countable: hide countable fields, show simple quantity
 */
function toggleUnitsPerPack() {
    const t = document.getElementById('medicine_type').value;
    const unitsSection = document.getElementById('unitsPerPackSection');
    const totalUnitsSection = document.getElementById('totalUnitsSection');
    const ql = document.getElementById('quantityLabel');
    const qh = document.getElementById('quantityHelp');
    const pl = document.getElementById('purchasePriceLabel');
    const sl = document.getElementById('sellingPriceLabel');
    const purchasePerUnit = document.getElementById('purchasePerUnitDisplay');
    const sellingPerUnit = document.getElementById('sellingPerUnitDisplay');

    if (isCountable(t)) {
        // Show countable UI
        unitsSection.style.display = 'block';
        totalUnitsSection.style.display = 'block';

        // Update labels for packs
        ql.textContent = 'Total Packs/Strips';
        qh.innerHTML = '<i class="bi bi-info-circle"></i> Number of <strong>packs/strips</strong> you are adding';

        // Price labels → per pack
        pl.textContent = '(per pack)';
        sl.textContent = '(per pack)';

        // Show per-unit price displays
        if (purchasePerUnit) purchasePerUnit.style.display = '';
        if (sellingPerUnit) sellingPerUnit.style.display = '';

    } else {
        // Hide countable UI
        unitsSection.style.display = 'none';
        totalUnitsSection.style.display = 'none';

        // Reset labels for non-countable
        ql.textContent = 'Quantity';
        qh.textContent = 'Number of packs/bottles in stock';
        pl.textContent = '';
        sl.textContent = '';

        // Hide per-unit price displays
        if (purchasePerUnit) purchasePerUnit.style.display = 'none';
        if (sellingPerUnit) sellingPerUnit.style.display = 'none';

        // For non-countable, total_packs IS the quantity
        syncQuantityField();
    }

    calculateTotalUnits();
    calculatePerUnitPrices();
}

/**
 * calculateTotalUnits()
 * Auto-calculates: Total Units = Units per Pack × Total Packs
 * Updates readonly display and hidden quantity field.
 */
function calculateTotalUnits() {
    const t = document.getElementById('medicine_type').value;
    const u = parseInt(document.getElementById('units_per_pack').value) || 0;
    const p = parseInt(document.getElementById('total_packs').value) || 0;
    const totalUnitsDisplay = document.getElementById('total_units_display');
    const quantityHidden = document.getElementById('quantity');
    const breakdownText = document.getElementById('breakdownText');

    if (isCountable(t)) {
        const totalUnits = u * p;

        // Update readonly display
        if (totalUnitsDisplay) totalUnitsDisplay.value = totalUnits;

        // Update hidden quantity field (sent to backend)
        if (quantityHidden) quantityHidden.value = totalUnits;

        // Update breakdown text
        if (breakdownText) {
            if (u > 0 && p > 0) {
                breakdownText.innerHTML = u + ' × ' + p
                    + ' = <strong>' + totalUnits + ' ' + t + 's</strong>';
            } else {
                breakdownText.textContent = 'Enter units per pack and total packs';
            }
        }
    } else {
        syncQuantityField();
    }
}

/**
 * syncQuantityField()
 * For non-countable medicines, quantity = total_packs value directly
 */
function syncQuantityField() {
    const packsInput = document.getElementById('total_packs');
    const quantityHidden = document.getElementById('quantity');
    if (quantityHidden && packsInput) {
        quantityHidden.value = packsInput.value || 0;
    }
}

/**
 * calculatePerUnitPrices()
 * Auto-calculates per-unit price from per-pack price.
 * Price per Unit = Price per Pack ÷ Units per Pack
 */
function calculatePerUnitPrices() {
    const t = document.getElementById('medicine_type').value;
    const u = parseInt(document.getElementById('units_per_pack').value) || 0;
    const pp = parseFloat(document.getElementById('purchase_price').value) || 0;
    const sp = parseFloat(document.getElementById('selling_price').value) || 0;
    const purchasePerUnit = document.getElementById('purchasePerUnitDisplay');
    const sellingPerUnit = document.getElementById('sellingPerUnitDisplay');

    if (isCountable(t) && u > 0) {
        const ppPerUnit = (pp / u).toFixed(2);
        const spPerUnit = (sp / u).toFixed(2);

        if (purchasePerUnit) {
            if (pp > 0) {
                purchasePerUnit.innerHTML = '→ Per ' + t + ': ₹' + ppPerUnit;
                purchasePerUnit.style.display = '';
            } else {
                purchasePerUnit.style.display = 'none';
            }
        }

        if (sellingPerUnit) {
            if (sp > 0) {
                sellingPerUnit.innerHTML = '→ Per ' + t + ': ₹' + spPerUnit;
                sellingPerUnit.style.display = '';
            } else {
                sellingPerUnit.style.display = 'none';
            }
        }
    } else {
        if (purchasePerUnit) purchasePerUnit.style.display = 'none';
        if (sellingPerUnit) sellingPerUnit.style.display = 'none';
    }
}

// ─── Event Listeners ───
document.getElementById('total_packs')
    .addEventListener('input', function() {
        calculateTotalUnits();
    });

document.getElementById('units_per_pack')
    .addEventListener('input', function() {
        calculateTotalUnits();
        calculatePerUnitPrices();
    });

document.getElementById('purchase_price')
    .addEventListener('input', calculatePerUnitPrices);

document.getElementById('selling_price')
    .addEventListener('input', calculatePerUnitPrices);

// Initialize on page load
toggleUnitsPerPack();
</script>
{% endblock %}
