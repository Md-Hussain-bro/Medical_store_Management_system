{% extends "base.html" %}

{% block title %}Add Medicine - PharmaCare{% endblock %}
{% block page_title %}Add New Medicine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Add New Medicine</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="medicineForm">
                    <div class="row">
                        <!-- Medicine Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Medicine Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required 
                                   placeholder="Enter medicine name">
                        </div>
                        
                        <!-- Generic Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Generic Name</label>
                            <input type="text" name="generic_name" class="form-control"
                                   placeholder="Enter generic name">
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- Medicine Type -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Medicine Type <span class="text-danger">*</span></label>
                            <select name="medicine_type" id="medicineType" class="form-select" required>
                                <option value="">-- Select Type --</option>
                                <option value="tablet">Tablet</option>
                                <option value="capsule">Capsule</option>
                                <option value="syrup">Syrup</option>
                                <option value="injection">Injection</option>
                                <option value="cream">Cream</option>
                                <option value="ointment">Ointment</option>
                                <option value="drops">Drops</option>
                                <option value="inhaler">Inhaler</option>
                                <option value="powder">Powder</option>
                                <option value="gel">Gel</option>
                                <option value="lotion">Lotion</option>
                                <option value="balm">Balm</option>
                                <option value="spray">Spray</option>
                                <option value="suppository">Suppository</option>
                                <option value="patch">Patch</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <!-- Units Per Pack (Only for countable types) -->
                        <div class="col-md-4 mb-3" id="unitsPerPackDiv" style="display: none;">
                            <label class="form-label">
                                <span id="unitsLabel">Units</span> Per Pack <span class="text-danger">*</span>
                            </label>
                            <input type="number" name="units_per_pack" id="unitsPerPack" 
                                   class="form-control" min="1" placeholder="e.g., 10, 15, 30">
                            <small class="text-muted" id="unitsHelp">Number of tablets/capsules in one pack</small>
                        </div>
                        
                        <!-- Batch Number -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Batch Number <span class="text-danger">*</span></label>
                            <input type="text" name="batch_no" class="form-control" required
                                   placeholder="Enter batch number">
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- Expiry Date -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Expiry Date <span class="text-danger">*</span></label>
                            <input type="date" name="expiry_date" class="form-control" required>
                        </div>
                        
                        <!-- Quantity (Packs) -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Quantity (Packs) <span class="text-danger">*</span></label>
                            <input type="number" name="quantity" id="quantity" class="form-control" 
                                   min="0" value="0" required placeholder="Number of packs">
                        </div>
                        
                        <!-- Total Units Display -->
                        <div class="col-md-4 mb-3" id="totalUnitsDiv" style="display: none;">
                            <label class="form-label">Total Units</label>
                            <input type="text" id="totalUnits" class="form-control bg-light" readonly>
                            <small class="text-muted">Auto-calculated</small>
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- Purchase Price -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Purchase Price ₹ <span class="text-danger">*</span></label>
                            <input type="number" name="purchase_price" class="form-control" 
                                   min="0" step="0.01" required placeholder="0.00">
                        </div>
                        
                        <!-- Selling Price -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Selling Price ₹ <span class="text-danger">*</span></label>
                            <input type="number" name="selling_price" class="form-control" 
                                   min="0" step="0.01" required placeholder="0.00">
                        </div>
                        
                        <!-- Supplier -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Supplier</label>
                            <input type="text" name="supplier" class="form-control"
                                   placeholder="Enter supplier name">
                        </div>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('inventory') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> Add Medicine
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Countable medicine types (need units per pack)
const countableTypes = ['tablet', 'capsule', 'suppository'];

// DOM Elements
const medicineType = document.getElementById('medicineType');
const unitsPerPackDiv = document.getElementById('unitsPerPackDiv');
const unitsPerPack = document.getElementById('unitsPerPack');
const unitsLabel = document.getElementById('unitsLabel');
const unitsHelp = document.getElementById('unitsHelp');
const totalUnitsDiv = document.getElementById('totalUnitsDiv');
const totalUnits = document.getElementById('totalUnits');
const quantity = document.getElementById('quantity');

// Update form based on medicine type selection
medicineType.addEventListener('change', function() {
    const selectedType = this.value;
    
    if (countableTypes.includes(selectedType)) {
        // Show units per pack field
        unitsPerPackDiv.style.display = 'block';
        totalUnitsDiv.style.display = 'block';
        unitsPerPack.required = true;
        
        // Update label based on type
        if (selectedType === 'tablet') {
            unitsLabel.textContent = 'Tablets';
            unitsHelp.textContent = 'Number of tablets in one pack/strip';
        } else if (selectedType === 'capsule') {
            unitsLabel.textContent = 'Capsules';
            unitsHelp.textContent = 'Number of capsules in one pack/strip';
        } else if (selectedType === 'suppository') {
            unitsLabel.textContent = 'Suppositories';
            unitsHelp.textContent = 'Number of suppositories in one pack';
        }
        
        calculateTotalUnits();
    } else {
        // Hide units per pack field
        unitsPerPackDiv.style.display = 'none';
        totalUnitsDiv.style.display = 'none';
        unitsPerPack.required = false;
        unitsPerPack.value = '';
        totalUnits.value = '';
    }
});

// Calculate total units when quantity or units per pack changes
function calculateTotalUnits() {
    const qty = parseInt(quantity.value) || 0;
    const unitsPerPackVal = parseInt(unitsPerPack.value) || 0;
    
    if (qty > 0 && unitsPerPackVal > 0) {
        const total = qty * unitsPerPackVal;
        totalUnits.value = total + ' ' + unitsLabel.textContent.toLowerCase();
    } else {
        totalUnits.value = '';
    }
}

// Event listeners for calculation
unitsPerPack.addEventListener('input', calculateTotalUnits);
quantity.addEventListener('input', calculateTotalUnits);

// Form validation before submit
document.getElementById('medicineForm').addEventListener('submit', function(e) {
    const selectedType = medicineType.value;
    
    if (countableTypes.includes(selectedType)) {
        const unitsVal = parseInt(unitsPerPack.value);
        if (!unitsVal || unitsVal < 1) {
            e.preventDefault();
            alert('Please enter the number of ' + unitsLabel.textContent.toLowerCase() + ' per pack.');
            unitsPerPack.focus();
            return false;
        }
    }
});
</script>
{% endblock %}
