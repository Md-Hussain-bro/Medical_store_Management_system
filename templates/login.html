{% extends "base.html" %}
{% block title %}Login - PharmaCare Pro{% endblock %}

{% block content_public %}
<div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4 col-xl-3">
        <div class="login-card">
            <div class="login-header">
                <div class="login-header-icon">
                    <i class="bi bi-hospital"></i>
                </div>
                <h2>PharmaCare</h2>
                <p>Sign in to your account</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="search-box">
                        <i class="bi bi-person search-icon"></i>
                        <input type="text" name="username" id="username"
                               class="form-control" placeholder="Enter your username"
                               required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="search-box">
                        <i class="bi bi-lock search-icon"></i>
                        <input type="password" name="password" id="password"
                               class="form-control" placeholder="Enter your password"
                               required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>

            <div class="login-footer">
                <small style="color: var(--text-muted);">
                    <i class="bi bi-shield-lock"></i> Secure encrypted connection
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
