{% extends "base.html" %}
{% block title %}Reports - PharmaCare{% endblock %}
{% block page_title %}Reports{% endblock %}

{% block content %}
<div class="row g-2 g-md-3">
    <div class="col-6 col-md-3">
        <a href="{{ url_for('daily_report') }}" class="text-decoration-none">
            <div class="card report-card text-center h-100">
                <div class="card-body py-4">
                    <div class="report-icon bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                        <i class="bi bi-calendar-day"></i>
                    </div>
                    <h6>Daily Report</h6>
                    <small class="text-muted d-none d-sm-block">Today's sales summary</small>
                </div>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="{{ url_for('date_range_report') }}" class="text-decoration-none">
            <div class="card report-card text-center h-100">
                <div class="card-body py-4">
                    <div class="report-icon bg-success bg-opacity-10 text-success mx-auto mb-3">
                        <i class="bi bi-calendar-range"></i>
                    </div>
                    <h6>Date Range</h6>
                    <small class="text-muted d-none d-sm-block">Custom period report</small>
                </div>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="{{ url_for('stock_report') }}" class="text-decoration-none">
            <div class="card report-card text-center h-100">
                <div class="card-body py-4">
                    <div class="report-icon bg-info bg-opacity-10 text-info mx-auto mb-3">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <h6>Stock Report</h6>
                    <small class="text-muted d-none d-sm-block">Current inventory</small>
                </div>
            </div>
        </a>
    </div>
    <div class="col-6 col-md-3">
        <a href="{{ url_for('expiry_report') }}" class="text-decoration-none">
            <div class="card report-card text-center h-100">
                <div class="card-body py-4">
                    <div class="report-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3">
                        <i class="bi bi-calendar-x"></i>
                    </div>
                    <h6>Expiry Report</h6>
                    <small class="text-muted d-none d-sm-block">Expiring medicines</small>
                </div>
            </div>
        </a>
    </div>
</div>
{% endblock %}
