{% extends "base.html" %}

{% block title %}Edit Medicine - Medical Store Management{% endblock %}
{% block page_title %}Edit Medicine{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-pencil"></i> Edit Medicine: {{ medicine.name }}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_medicine', id=medicine.id) }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Medicine Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required
                                   value="{{ medicine.name }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="generic_name" class="form-label">Generic Name</label>
                            <input type="text" class="form-control" id="generic_name" name="generic_name"
                                   value="{{ medicine.generic_name or '' }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="batch_no" class="form-label">Batch Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="batch_no" name="batch_no" required
                                   value="{{ medicine.batch_no }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="expiry_date" class="form-label">Expiry Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="expiry_date" name="expiry_date" required
                                   value="{{ medicine.expiry_date.strftime('%Y-%m-%d') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="quantity" class="form-label">Quantity <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="quantity" name="quantity" 
                                   required min="0" value="{{ medicine.quantity }}">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="purchase_price" class="form-label">Purchase Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="purchase_price" name="purchase_price" 
                                   required min="0" step="0.01" value="{{ medicine.purchase_price }}">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="selling_price" class="form-label">Selling Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="selling_price" name="selling_price" 
                                   required min="0" step="0.01" value="{{ medicine.selling_price }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="supplier" class="form-label">Supplier</label>
                        <input type="text" class="form-control" id="supplier" name="supplier"
                               value="{{ medicine.supplier or '' }}">
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('inventory') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Update Medicine
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
